name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
      - name: Test desktop and financial core
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build native executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --paths src --hidden-import keyring.backends.Windows --name "WB Profit Desktop" packaging/launcher.py
      - name: Smoke test packaged application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath '.\dist\WB Profit Desktop\WB Profit Desktop.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Desktop startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is required on the build runner' }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed application and data preservation
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/verify_windows.py dist/installer/WB-Profit-Desktop-Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WB-Profit-Desktop-Windows
          path: |
            dist/installer/*.exe
            dist/installer/verification.json
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
      - name: Save installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WB-Profit-Desktop-Windows-diagnostics
          path: dist/installer/verification-logs/
          if-no-files-found: ignore
