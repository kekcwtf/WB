[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-profit-desktop"
version = "0.1.0"
description = "Локальная финансовая аналитика Wildberries"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.1", "keyring==25.7.0", "httpx==0.28.1"]

[project.gui-scripts]
wb-profit-desktop = "wb_profit.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
